<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#160d24" />
    <meta name="description" content="Surfordie — เกมเอาชีวิตรอดจากฝูงซอมบี้ 3 มิติ เล่นบนมือถือได้ทันที" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Surfordie</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* boot splash: visible before the game bundle runs, removed by Screens */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(ellipse at 50% 40%, #3a2366, #160d24 70%);
        font-family: "Kanit", system-ui, sans-serif;
        color: #fff;
        transition: opacity 0.45s ease;
      }
      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }
      #boot b {
        font-size: clamp(40px, 13vw, 72px);
        font-weight: 800;
        letter-spacing: 1px;
        color: #ffd23f;
        -webkit-text-stroke: 3px #160d24;
        text-shadow: 0 5px 0 #160d24, 0 0 24px rgba(255, 61, 154, 0.5);
      }
      #boot i {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 6px solid rgba(255, 255, 255, 0.15);
        border-top-color: #ff3d9a;
        animation: boot-spin 0.8s linear infinite;
      }
      #boot span {
        font-size: 15px;
        font-weight: 600;
        opacity: 0.75;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="gl"></canvas>
      <canvas id="overlay"></canvas>
      <div id="ui"></div>
    </div>
    <div id="boot"><b>SURFORDIE</b><i></i><span>กำลังเตรียมฝูงซอมบี้...</span></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
